# Example shairport-sync-rs configuration (TOML)
#
# Precedence order is:
# defaults < file (this TOML) < environment (SSR_*) < CLI flags
#
# This sectioned layout is inspired by upstream shairport-sync's grouped config style.

[general]
name = "Shairport Sync RS"
port = 5000
max_clients = 10
# password = "change-me"
# service_type = "auto"                     # "auto" | "airplay2" | "classic"
# mdns_backend = "avahi"
# interface = ""
# udp_port_base = 6001                        # AP1 only
# udp_port_range = 10                         # AP1 only
# regtype = "_raop._tcp"
# drift_tolerance_in_seconds = 0.002
# resync_threshold_in_seconds = 0.050
# playback_mode = "stereo"                   # stereo | mono | reverse stereo | both left | both right
# interpolation = "auto"                     # auto | vernier | basic | soxr
# alac_decoder = "ffmpeg"
# ignore_volume_control = "no"
# volume_range_db = 60
# volume_max_db = 0.0
# volume_control_profile = "standard"
# default_airplay_volume = -24.0
# run_this_when_volume_is_set = "/full/path/to/hook"
# audio_backend_latency_offset_in_seconds = 0.0
# audio_backend_buffer_desired_length_in_seconds = 0.2
# audio_decoded_buffer_desired_length_in_seconds = 1.0
# audio_backend_buffer_interpolation_threshold_in_seconds = 0.075
# audio_backend_silent_lead_in_time = "auto"
# dbus_service_bus = "system"
# mpris_service_bus = "system"
# resend_control_first_check_time = 0.10
# resend_control_check_interval_time = 0.25
# resend_control_last_check_time = 0.10
# missing_port_dacp_scan_interval_seconds = 2.0

[audio]
backend = "alsa"
output_format = "f32le"
pipe_path = "/tmp/shairport-sync-rs.pcm"
airplay_mode = "ap2"
# raop_output_sample_rate = 48000
# raop_output_max_channels = 2
# output_channels = 2
# mixdown = "auto"
# output_channel_mapping = "auto"

[audio.alsa]
device = "default"
period_frames = 1024
buffer_frames = 4096
# mixer_control_name = "PCM"
# mixer_control_index = 0
# mixer_device = "default"
# output_rate = "auto"
# output_format = "auto"
# output_channels = "auto"
# disable_synchronization = "no"
# use_mmap_if_available = "no"
# use_hardware_mute_if_available = "no"
# maximum_stall_time = 0.200
# use_precision_timing = "auto"
# disable_standby_mode = "never"
# disable_standby_mode_silence_threshold = 0.040
# disable_standby_mode_silence_scan_interval = 0.030
# disable_standby_mode_default_channels = 2
# disable_standby_mode_default_rate = 44100

[audio.pipewire]
# Forward-compatible section for upcoming PipeWire backend support.
# Keep backend = "alsa" until a runtime PipeWire backend is added.
# application_name = "Shairport Sync RS"
# node_name = "shairport-sync-rs"
# sink_target = ""
# output_rate = 48000
# output_format = "f32le"
# output_channels = 2
# default_channel_layouts = "alsa"

[audio.pipe]
# Placeholder for upstream-style pipe backend tuning.
# name = "/tmp/shairport-sync-audio"
# output_rate = 44100
# output_format = "S16_LE"
# output_channels = 2

[audio.stdout]
# Placeholder for upstream-style stdout backend tuning.
# output_rate = 44100
# output_format = "S16_LE"
# output_channels = 2

[ap1]
# Applies when audio.airplay_mode = "ap1"
# codecs = ["pcm", "alac"]
# encryption = ["none", "rsa"]

[ap2]
# Applies when audio.airplay_mode = "ap2"
# pin = "12345678"
# pairing_store_path = "/var/lib/shairport-sync-rs/pairings.json"

[observability]
activity_interval_secs = 30
# activity_snapshot_path = "/var/log/shairport-sync-rs/activity.jsonl"
log_format = "text"

# -----------------------------------------------------------------------------
# Upstream compatibility placeholders
# -----------------------------------------------------------------------------
# The sections below mirror upstream shairport-sync config areas so operators can
# stage migrations. In shairport-sync-rs today, these are placeholders unless
# explicit runtime wiring has been implemented.

[sessioncontrol]
# run_this_before_entering_active_state = "/full/path/to/hook"
